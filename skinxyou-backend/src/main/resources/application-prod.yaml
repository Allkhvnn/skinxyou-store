# Production: every secret comes from the environment, no defaults.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true

admin:
  # Required in production (no random fallback): at least 32 characters.
  jwt-secret: ${ADMIN_JWT_SECRET}

billz:
  secret-token: ${BILLZ_SECRET_TOKEN}
  sync:
    enabled: true

server:
  forward-headers-strategy: framework
