# Production: every secret comes from the environment, no defaults.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true

billz:
  secret-token: ${BILLZ_SECRET_TOKEN}
  sync:
    enabled: true

server:
  forward-headers-strategy: framework
