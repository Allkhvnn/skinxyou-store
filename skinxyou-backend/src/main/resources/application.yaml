spring:
  application:
    name: skinxyou-backend
  profiles:
    default: dev
  mvc:
    problemdetails:
      # RFC 9457 error bodies without internal details.
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Loads brands/images for a page of products in a few queries instead of N+1.
        default_batch_fetch_size: 50
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

billz:
  base-url: https://api-admin.billz.ai
  secret-token: ${BILLZ_SECRET_TOKEN:}
  # Static value BILLZ documents for all integrations.
  platform-id: 7d4a4c38-dd84-4902-b744-0488b80a4c01
  connect-timeout: 10s
  read-timeout: 60s
  # BILLZ limit: 2 requests/second for the whole integration.
  min-request-interval: 550ms
  max-attempts: 4
  initial-backoff: 1s
  sync:
    enabled: false
    # Store Skinxyou — the only BILLZ shop; its prices and stock are shown on the site.
    shop-id: ${BILLZ_SHOP_ID:3d2238cf-e37a-4377-9efa-96e29d8f1056}
    page-size: 200
    delta-overlap: 2m
    max-full-sync-drop: 0.5
    initial-delay: PT1M
    delta-interval: PT15M
    # Daily full reconciliation at 04:00 Almaty time.
    full-cron: "0 0 4 * * *"

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
