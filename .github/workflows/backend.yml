name: Backend CI

on:
  push:
    branches: [main]
    paths: ["skinxyou-backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["skinxyou-backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skinxyou-backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      # Includes Testcontainers integration tests (Docker is available on ubuntu runners).
      - run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: skinxyou-backend/build/reports/tests/
